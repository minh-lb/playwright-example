services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin
      KC_HOSTNAME: http://localhost:8080/idp
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  web:
    image: ${WEB_IMAGE:-mini-booking-web:local}
    build: .
    depends_on:
      - keycloak
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_FILE: ${DATABASE_FILE:-dev.db}
      AUTH_SECRET: local-minibooking-dev-secret-change-me-before-sharing
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: mini-booking
      AUTH_KEYCLOAK_SECRET: mini-booking-local-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/idp/realms/mini-booking
      AUTH_KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - next-cache:/app/.next
      - ./data:/app/data

  queue-worker:
    image: ${WEB_IMAGE:-mini-booking-web:local}
    build: .
    depends_on:
      - web
    environment:
      DATABASE_FILE: ${DATABASE_FILE:-dev.db}
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - ./data:/app/data
    # Wait for the web startup command to generate Prisma Client and push schema.
    command:
      - sh
      - -c
      - >-
        until node -e "fetch('http://web:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do sleep 1; done;
        npm run queue:worker

volumes:
  keycloak-data:
  web-node-modules:
  next-cache:
