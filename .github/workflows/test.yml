name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit, smoke, and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Start app and Keycloak for E2E
        run: DATABASE_FILE=test.db docker compose up -d --build

      - name: Wait for app health in test mode
        run: |
          for attempt in $(seq 1 120); do
            health="$(curl --silent --fail http://localhost:3000/api/health || true)"
            if [ -n "$health" ]; then
              database="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).database)' "$health")"
              if [ "$database" = "test" ]; then
                echo "App is ready with the test database"
                exit 0
              fi
              echo "App is responding with database '$database'; expected 'test'."
              docker compose logs web
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for the app health endpoint."
          docker compose ps
          docker compose logs web
          exit 1

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Stop app and Keycloak
        if: always()
        run: docker compose down -v --remove-orphans
