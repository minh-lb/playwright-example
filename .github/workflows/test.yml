name: Next.js + Laravel integration

on:
  push:
    branches: [main, refactor-structure]
  pull_request:

jobs:
  frontend:
    name: Next.js unit, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        env:
          AUTH_SECRET: local-minibooking-ci-build-secret
          AUTH_URL: http://localhost:3000
          AUTH_KEYCLOAK_ID: mini-booking
          AUTH_KEYCLOAK_SECRET: mini-booking-local-secret
          AUTH_KEYCLOAK_ISSUER: http://localhost:8080/idp/realms/mini-booking
          BACKEND_INTERNAL_URL: http://laravel
          INTERNAL_API_SECRET: local-booking-shared-secret-change-before-sharing
        run: npm run build

  integration:
    name: FrankenPHP, Laravel API and Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install frontend
        working-directory: nextjs
        run: npm ci
      - name: Install Chromium
        working-directory: nextjs
        run: npx playwright install --with-deps chromium
      - name: Build and launch local stack with isolated database
        env:
          DATABASE_FILE: test.sqlite
        run: docker compose up -d --build
      - name: Wait for Next.js and Laravel
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=100 laravel nextjs
          exit 1
      - name: Laravel feature tests
        run: docker compose exec -T laravel php artisan test
      - name: HTTP smoke tests
        working-directory: nextjs
        run: npm run test:smoke
      - name: Playwright E2E
        working-directory: nextjs
        run: npm run test:e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop containers
        if: always()
        run: docker compose down

  required:
    name: Laravel and Next.js tests
    runs-on: ubuntu-latest
    needs: [frontend, integration]
    if: always()
    steps:
      - name: Require all jobs
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
